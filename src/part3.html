<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\r?\n/g,'<br>');
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='chumi-invoice-v1';
const H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const isFramed=(()=>{try{return window.self!==window.top}catch(e){return true}})();

const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return Number.isFinite(n)?n:0};
const numStr=v=>String(+num(v).toFixed(4));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const addDays=(s,n)=>{const d=parseD(s);if(!d)return '';d.setDate(d.getDate()+n);return iso(d)};
const fmtDate=s=>{const d=parseD(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}):''};
const today=()=>iso(new Date());
const bump=s=>/\d+\D*$/.test(s||'')?String(s).replace(/(\d+)(\D*)$/,(m,n,r)=>String(+n+1).padStart(n.length,'0')+r):((s||'INV')+'-2');

/* ---------- money (all maths in whole minor units; "whole" mode uses whole currency units) ---------- */
const CURRENCIES=[['INR','Indian rupee'],['AED','UAE dirham'],['USD','US dollar'],['EUR','Euro'],['GBP','British pound'],['SAR','Saudi riyal'],['QAR','Qatari riyal'],['KWD','Kuwaiti dinar'],['BHD','Bahraini dinar'],['OMR','Omani rial'],['CAD','Canadian dollar'],['AUD','Australian dollar'],['NZD','New Zealand dollar'],['SGD','Singapore dollar'],['CHF','Swiss franc'],['JPY','Japanese yen'],['CNY','Chinese yuan'],['ZAR','South African rand'],['MXN','Mexican peso'],['BRL','Brazilian real']];
const nfs={};
const nf=(c,d)=>{const k=c+d;return nfs[k]||(nfs[k]=new Intl.NumberFormat(c==='INR'?'en-IN':'en-US',{style:'currency',currency:c,minimumFractionDigits:d,maximumFractionDigits:d}))};
const dec=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:c}).resolvedOptions().maximumFractionDigits;
const digits=s=>s.whole?0:dec(s.currency);
const fmt=s=>{const d=digits(s),f=nf(s.currency,d),m=Math.pow(10,d);return v=>f.format((v||0)/m)};
const taxOf=(base,rate)=>Math.round(+(base*rate/100).toFixed(6));

function calc(s){
  const d=digits(s),m=Math.pow(10,d);
  const items=s.items.map(it=>{
    const q=num(it.qty),rateM=Math.round(+(num(it.rate)*m).toFixed(6));
    return{id:it.id,desc:it.desc||'',q,rateM,amt:Math.round(+(q*rateM).toFixed(6))};
  });
  const subtotal=items.reduce((a,i)=>a+i.amt,0);
  const dv=Math.max(num(s.discount.value),0);
  let discount=s.discount.type==='percent'?Math.round(+(subtotal*Math.min(dv,100)/100).toFixed(6)):Math.round(+(dv*m).toFixed(6));
  if(subtotal>=0)discount=Math.min(discount,subtotal);
  const taxable=subtotal-discount,rate=Math.max(num(s.tax.rate),0);
  let tax,total;
  if(s.tax.inclusive&&rate>0){tax=taxable-Math.round(+(taxable/(1+rate/100)).toFixed(6));total=taxable}
  else{
    /* a tax amount stored by the auto invoice holds only while the taxable value and the rate are unchanged */
    const fx=s.tax.fixed,own=fx!=null&&String(fx)!==''&&s.tax.fixedFor===taxable+'@'+rate;
    tax=own?Math.round(+(num(fx)*m).toFixed(6)):taxOf(taxable,rate);total=taxable+tax;
  }
  const adj=Math.round(+(num(s.adjustment)*m).toFixed(6));
  total+=adj;
  const paid=Math.round(+(num(s.paid)*m).toFixed(6));
  return{d,m,items,subtotal,discount,taxable,tax,adj,total,paid,due:total-paid};
}

//__GEN__

/* ---------- state ---------- */
const item=(desc,qty,rate)=>({id:uid(),desc:desc||'',qty:String(qty==null?1:qty),rate:rate==null?'':String(rate)});
function sampleState(){
  const t=today();
  return{sample:true,title:'Invoice',number:'INV-014',issue:t,terms:'14',due:addDays(t,14),po:'',stamp:'none',
    from:{name:'Northstar Studio',email:'hello@northstar.studio',phone:'+1 555 0142',address:'18 Harbor Street\nPortland, OR 97201',taxId:''},
    to:{name:'Avery Chen',company:'Chen & Co.',email:'avery@chenco.com',address:'92 Alder Avenue\nSeattle, WA 98101',taxId:''},
    logo:'',currency:'USD',
    items:[item('Brand identity & art direction',1,2400),item('Website design, 5 pages',1,1800),item('Illustration suite',1,750)],
    discount:{type:'percent',value:''},tax:{label:'Tax',rate:'8',inclusive:false},adjustment:'',paid:'',whole:false,
    notes:'Thank you for your business!',
    payment:'Bank transfer to Example Bank\nAccount name: Northstar Studio\nAccount no. 0000 0000. Please quote the invoice number.',
    footer:'Questions about this invoice? Reply to the email it came with.',
    layout:DEFAULT_TPL,accent:'',sign:false,signLabel:'Authorised signature',signImg:'',pos:{}};
}
const clonePos=p=>JSON.parse(JSON.stringify(p||{}));
function blankInvoice(keep){
  const t=today(),o=keep||sampleState();
  return{sample:false,title:o.title||'Invoice',number:keep?bump(keep.number):'INV-001',issue:t,terms:o.terms||'14',due:addDays(t,o.terms==='custom'?14:(+o.terms||0)),po:'',stamp:'none',
    from:keep?{...keep.from}:{name:'',email:'',phone:'',address:'',taxId:''},
    to:{name:'',company:'',email:'',address:'',taxId:''},
    logo:keep?keep.logo:'',currency:o.currency,items:[item('',1,'')],
    discount:{type:'percent',value:''},tax:keep?{...keep.tax,fixed:'',fixedFor:''}:{label:'Tax',rate:'',inclusive:false},adjustment:'',paid:'',whole:keep?!!keep.whole:false,
    notes:keep?keep.notes:'',payment:keep?keep.payment:'',footer:keep?keep.footer:'',layout:o.layout,accent:o.accent,
    sign:!!o.sign,signLabel:typeof o.signLabel==='string'?o.signLabel:'Authorised signature',signImg:keep?(keep.signImg||''):'',pos:keep?clonePos(keep.pos):{}};
}
const defaultTool=()=>({total:'25000',n:'5',cat:'it',grp:'all',gst:'18',cur:'INR',seed:'1'});
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function merge(base,over){for(const k in over){if(isObj(base[k])&&isObj(over[k]))merge(base[k],over[k]);else base[k]=over[k]}return base}
const app={inv:null,xt:null};
const ui={tab:'details'};
function load(){
  try{
    const o=JSON.parse(LS.get(KEY)||'null');
    if(o&&o.inv){app.inv=merge(sampleState(),o.inv);app.xt=merge(defaultTool(),o.xt||{})}
  }catch(e){}
  if(!app.inv){app.inv=sampleState();app.xt=defaultTool()}
  /* an invoice saved with the old 16 layouts moves to the default template */
  if(!TPL.some(t=>t.id===app.inv.layout)){app.inv.layout=DEFAULT_TPL;app.inv.accent=''}
  if(!/^#[0-9a-f]{6}$/i.test(app.inv.accent||''))app.inv.accent='';
  if(!/^\d{1,12}$/.test(String(app.xt.total).replace(/,/g,'')))app.xt.total=defaultTool().total;
  app.inv.items.forEach(i=>{if(!i.id)i.id=uid()});
  const iv=app.inv;
  iv.sign=!!iv.sign;
  if(typeof iv.signLabel!=='string')iv.signLabel='Authorised signature';
  iv.signLabel=iv.signLabel.slice(0,40);
  if(typeof iv.signImg!=='string'||!/^data:image\/(png|jpeg|webp|gif);base64,/.test(iv.signImg))iv.signImg='';
  iv.pos=cleanPos(iv.pos);
}
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}

//__TPL__

/* ---------- block positions (drag to move) ---------- */
const BLOCKS=['brand','title','no','dates','bill','from','ref','due','pay','note','totals','sign','contact','foot','stamp'];
const LIM=500;
function cleanPos(p){
  const out={};
  if(!isObj(p))return out;
  for(const id in p){
    if(!TPL.some(t=>t.id===id)||!isObj(p[id]))continue;
    for(const k of BLOCKS){
      const v=p[id][k];
      if(Array.isArray(v)&&v.length===2&&isFinite(+v[0])&&isFinite(+v[1])){
        const x=Math.max(-LIM,Math.min(LIM,Math.round(+v[0]))),y=Math.max(-LIM,Math.min(LIM,Math.round(+v[1])));
        if(x||y){(out[id]||(out[id]={}))[k]=[x,y]}
      }
    }
  }
  return out;
}
function posOf(s,k){
  const p=s.pos&&s.pos[s.layout],v=p&&p[k];
  return Array.isArray(v)&&v.length===2?[+v[0]||0,+v[1]||0]:[0,0];
}
/* the stamp is absolutely placed, every other block is nudged with relative left/top */
function posStyle(k,x,y){return k==='stamp'?'left:calc(50% + '+x+'px);top:'+(380+y)+'px':'position:relative;left:'+x+'px;top:'+y+'px'}

/* ---------- the invoice document ---------- */
const tplOf=s=>TPL.find(t=>t.id===s.layout)||TPL[0];
function paperHTML(s){
  const T=tplOf(s),c=calc(s),M=fmt(s);
  const A=/^#[0-9a-f]{6}$/i.test(s.accent||'')?s.accent:T.a;
  const col={a:A,a2:shade(A,.28),a3:shade(A,-.22),b:T.b,c:T.c||'#ffffff'};
  const f=s.from,t=s.to;
  const bk=k=>{const v=posOf(s,k);return' data-b="'+k+'"'+((v[0]||v[1])?' style="'+posStyle(k,v[0],v[1])+'"':'')};
  const join=a=>a.filter(Boolean).join('<br>');
  const fromSmall=join([f.address&&nl(f.address),f.email&&esc(f.email),f.phone&&esc(f.phone),f.taxId&&('Tax ID: '+esc(f.taxId))]);
  const toSmall=join([t.address&&nl(t.address),t.email&&esc(t.email),t.taxId&&('Tax ID: '+esc(t.taxId))]);
  const rows=c.items.filter(i=>i.desc.trim()||i.amt).map((i,k)=>'<tr><td class="c-n">'+pad(k+1)+'</td><td class="c-d">'+(nl(i.desc)||'&nbsp;')+'</td><td class="c-r">'+M(i.rateM)+'</td><td class="c-q">'+numStr(i.q)+'</td><td class="c-a">'+M(i.amt)+'</td></tr>').join('')
    ||'<tr><td class="c-n">01</td><td class="c-d"><span class="p-hint">Describe your first item</span></td><td class="c-r"></td><td class="c-q"></td><td class="c-a"></td></tr>';
  const rate=Math.max(num(s.tax.rate),0),tl=esc(s.tax.label||'Tax'),rl=tl+(rate>0?' ('+numStr(rate)+'%)':'');
  const incl=s.tax.inclusive&&rate>0,R=(l,v,cls)=>'<div class="r'+(cls?' '+cls:'')+'"><span>'+l+'</span><span>'+v+'</span></div>';
  const tr=[];
  if(incl){
    if(c.discount){tr.push(R('Items total',M(c.subtotal)));tr.push(R('Discount'+(s.discount.type==='percent'?' ('+numStr(s.discount.value)+'%)':''),'-'+M(c.discount)))}
    tr.push(R('Taxable value',M(c.taxable-c.tax)));
    tr.push(R(rl,M(c.tax)));
  }else{
    tr.push(R('Subtotal',M(c.subtotal)));
    if(c.discount)tr.push(R('Discount'+(s.discount.type==='percent'?' ('+numStr(s.discount.value)+'%)':''),'-'+M(c.discount)));
    if(rate>0)tr.push(R(rl,M(c.tax)));
  }
  if(c.adj)tr.push(R('Rounding',(c.adj<0?'-':'')+M(Math.abs(c.adj))));
  const paidOn=c.paid>0;
  tr.push(R('Total'+(incl?' (incl. '+tl+')':''),M(c.total),paidOn?'p-strong':'p-grand'));
  if(paidOn){tr.push(R('Paid','-'+M(c.paid)));tr.push(R('Balance due',M(c.due),'p-grand'))}
  const stamps={paid:'Paid',overdue:'Overdue',draft:'Draft'};
  const stamp=stamps[s.stamp]?'<div class="p-stamp p-stamp-'+s.stamp+'"'+bk('stamp')+'>'+stamps[s.stamp]+'</div>':'';
  const ct=[f.phone&&['t',f.phone],f.email&&['e',f.email],f.address&&['a',f.address.replace(/\s*\n\s*/g,', ')]].filter(Boolean);
  const contact=(ct.length||f.taxId)?'<div class="p-contact"'+bk('contact')+'><div class="p-label">Contact</div>'+ct.map(x=>'<div class="ct"><i>'+ICON[x[0]]+'</i><span>'+esc(x[1])+'</span></div>').join('')+(f.taxId?'<div class="ct tx"><span>Tax ID: '+esc(f.taxId)+'</span></div>':'')+'</div>':'';
  const dated=(fmtDate(s.issue)||'-');
  return'<div class="paper" data-tpl="'+T.id+'"'+(T.num?' data-num="1"':'')+(s.logo?' data-logo="1"':'')+' style="--a:'+col.a+';--a2:'+col.a2+';--a3:'+col.a3+';--b:'+col.b+';--c:'+col.c+';--pg:'+T.pg+'">'
   +'<div class="p-deco" aria-hidden="true">'+(DECO[T.id]?DECO[T.id](col):'')+'</div>'
   +'<div class="p-page">'
   +'<div class="p-brand"'+bk('brand')+'>'+(s.logo?'<img class="p-logo" src="'+esc(s.logo)+'" alt="">':'')+'<div class="p-bizname'+(f.name?'':' p-hint')+'">'+(f.name?esc(f.name):'Your business name')+'</div></div>'
   +'<div class="p-title"'+bk('title')+'><h1>'+esc(s.title||'Invoice')+'</h1>'+(s.number?'<div class="p-num">No. '+esc(s.number)+'</div>':'')+'</div>'
   +(s.number?'<div class="p-no"'+bk('no')+'>No. '+esc(s.number)+'</div>':'')
   +'<dl class="p-dates"'+bk('dates')+'>'+(s.number?'<div class="d-no"><dt>Invoice no.</dt><dd>'+esc(s.number)+'</dd></div>':'')+'<div><dt>Issued</dt><dd>'+dated+'</dd></div><div><dt>Due</dt><dd>'+(fmtDate(s.due)||'-')+'</dd></div>'+(s.po?'<div><dt>Reference</dt><dd>'+esc(s.po)+'</dd></div>':'')+'</dl>'
   +'<div class="p-bill"'+bk('bill')+'><div class="p-label">'+esc(T.bill||'Billed to')+'</div><div class="p-client'+((t.name||t.company)?'':' p-hint')+'">'+((t.name||t.company)?join([esc(t.name),esc(t.company)]):'Client name')+'</div>'+(toSmall?'<div class="p-small">'+toSmall+'</div>':'')+'</div>'
   +'<div class="p-from"'+bk('from')+'><div class="p-label">'+esc(T.from||'From')+'</div><div class="p-client'+(f.name?'':' p-hint')+'">'+(f.name?esc(f.name):'Your business name')+'</div>'+(fromSmall?'<div class="p-small">'+fromSmall+'</div>':'')+'</div>'
   +'<div class="p-ref"'+bk('ref')+'><div class="p-label">Reference</div><div class="p-refv">'+esc(s.po||s.number||'-')+'</div></div>'
   +'<div class="p-due"'+bk('due')+'><div class="p-label">'+(paidOn?'Balance due':'Total due')+'</div><div class="p-duev">'+M(c.due)+'</div></div>'
   +'<table class="p-items"><colgroup><col class="c-n"><col class="c-d"><col class="c-r"><col class="c-q"><col class="c-a"></colgroup><thead><tr><th class="c-n">No.</th><th class="c-d">Description</th><th class="c-r">Price</th><th class="c-q">Qty</th><th class="c-a">Amount</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +(s.payment?'<div class="p-pay"'+bk('pay')+'><div class="p-label">Payment details</div><div class="p-txt">'+nl(s.payment)+'</div></div>':'')
   +(s.notes?'<div class="p-note"'+bk('note')+'><div class="p-label">Notes</div><div class="p-txt">'+nl(s.notes)+'</div></div>':'')
   +'<div class="p-totals"'+bk('totals')+'>'+tr.join('')+'</div>'
   +(s.sign?'<div class="p-sign'+(s.signImg?' has-img':'')+'"'+bk('sign')+'>'+(s.signImg?'<img class="sg-img" src="'+esc(s.signImg)+'" alt="">':'')+'<div class="sg-line"></div><div class="sg-txt">'+esc(s.signLabel)+'</div></div>':'')
   +contact
   +'<footer class="p-foot"'+bk('foot')+'>'+(s.footer?nl(s.footer):'')+'</footer>'
   +'</div>'+stamp+'</div>';
}

/* ---------- scaled previews ---------- */
const hosts=new Map();
function fit(host,o){
  o=o||hosts.get(host)||{};
  const sc=host.firstElementChild,paper=sc&&sc.firstElementChild,w=host.clientWidth;
  if(!paper||!w)return;
  const k=w/794;
  sc.style.transform='scale('+k+')';
  if(!o.noHeight)host.style.height=Math.ceil(paper.offsetHeight*k)+'px';
}
const ro=new ResizeObserver(es=>es.forEach(e=>fit(e.target)));
function mount(host,o){hosts.set(host,o||{});ro.observe(host);fit(host,o||{})}
const refit=()=>hosts.forEach((o,h)=>fit(h,o));

/* ---------- toast ---------- */
let toastT=0;
function toast(msg,action){
  const el=$('#toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button type="button">'+esc(action.label)+'</button>':'');
  if(action)$('button',el).onclick=()=>{el.classList.remove('on');action.fn()};
  el.classList.add('on');clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('on'),action?7000:2800);
}

/* ---------- motion helpers ---------- */
const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
const reduced=()=>RM.matches;
const easeOut=t=>1-Math.pow(1-t,4);
function tween(el,from,to,f,ms){
  if(!el)return;
  if(reduced()||from===to||!window.requestAnimationFrame){el.textContent=f(to);return}
  const t0=performance.now();
  (function step(now){const k=Math.min(1,Math.max(0,(now-t0)/ms));el.textContent=f(k>=1?to:Math.round(from+(to-from)*easeOut(k)));if(k<1)requestAnimationFrame(step)})(t0);
}
function once(el,cls){
  if(!el||reduced())return;
  el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);
  el.addEventListener('animationend',function h(e){if(e.target!==el)return;el.classList.remove(cls);el.removeEventListener('animationend',h)});
}
const revIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  revIO.unobserve(e.target);e.target.classList.add('in');
  $$('[data-count]',e.target).forEach(c=>tween(c,0,+c.dataset.count,c._f||String,1100));
}),{threshold:.08,rootMargin:'0px 0px -5% 0px'}):null;
function armReveals(){
  $$('[data-reveal]').forEach(el=>{
    if(el.dataset.armed)return;el.dataset.armed='1';
    if(el.dataset.reveal==='stagger')Array.from(el.children).forEach((c,i)=>c.style.setProperty('--i',i));
    if(revIO)revIO.observe(el);else el.classList.add('in');
  });
}
/* ---------- loading intro (anime.js v4 from the CDN; a plain fade if it cannot load) ---------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function whenAnime(cb){
  const t0=performance.now();
  (function poll(){
    if(window.anime&&window.anime.animate)return cb(window.anime);
    if(window.__animeFail||performance.now()-t0>2500)return cb(null);
    setTimeout(poll,40);
  })();
}
function runIntro(){
  const el=$('#intro'),root=document.documentElement;
  if(!el||reduced()){if(el)el.remove();root.classList.remove('has-intro','anime-pending');return}
  const bar=$('.in-bar i',el),pct=$('.in-pct',el),label=$('.in-state',el),st={v:0},lift={v:0};
  let over=false;
  const done=()=>{if(over)return;over=true;el.remove();root.classList.remove('has-intro','anime-pending')};
  const paint=()=>{const v=Math.max(0,Math.min(100,st.v));bar.style.transform='scaleX('+(v/100)+')';pct.textContent=Math.round(v)+'%'};
  el.addEventListener('click',done);
  setTimeout(done,9000);
  whenAnime(async A=>{
    if(over)return;
    const t0=performance.now();
    let fo=false,pg=false;
    const tgt=()=>30+(fo?40:0)+(pg?30:0);
    const tweenTo=(v,ms)=>new Promise(res=>{
      const end=()=>{st.v=v;paint();res()};
      if(!A){bar.style.transition='transform .5s cubic-bezier(.22,1,.36,1)';return end()}
      try{A.animate(st,{v,duration:ms,ease:'outQuad',onUpdate:paint,onComplete:end})}catch(e){end()}
    });
    const chase=()=>tweenTo(tgt(),tgt()>=100?500:650);
    try{
      if(A){
        const {createTimeline,stagger}=A;
        const tl=createTimeline({defaults:{ease:'outExpo'}});
        tl.add('.in-shape',{opacity:[0,1],scale:[.3,1],duration:800,delay:stagger(110)},0)
          .add('.in-s2',{rotate:[18,18],duration:800},0)
          .add('.in-receipt',{opacity:[0,1],translateY:['-125%','0%'],duration:850},80)
          .add('.in-logo>span',{opacity:[0,1],translateY:['100%','0%'],duration:700,delay:stagger(55)},520)
          .add('.in-rule',{opacity:[0,1],scaleX:[0,1],duration:600},1050)
          .add('.in-load',{opacity:[0,1],translateY:['40%','0%'],duration:600},1150);
      }else root.classList.remove('anime-pending');
    }catch(e){A=null;root.classList.remove('anime-pending')}
    const fonts=Promise.race([
      Promise.all(['800 1em "Bricolage Grotesque"','700 1em "Anek Malayalam"'].map(f=>document.fonts?document.fonts.load(f,'Chumiരസീത്'):0)),
      wait(3000)
    ]).catch(()=>{});
    const page=new Promise(r=>document.readyState==='complete'?r():window.addEventListener('load',()=>r(),{once:true}));
    fonts.then(()=>{fo=true;chase()});
    page.then(()=>{pg=true;chase()});
    chase();

    if(over)return;

        .call(()=>root.classList.remove('has-intro'),460)

const PAGE={h:1123,top:48,bottom:40};
function planPages(H,safe){
  if(H<=PAGE.h+2)return[[0,H,0]];
  const out=[];let y=0;
  while(y<H-2){
    const top=out.length?PAGE.top:0,cap=PAGE.h-top-PAGE.bottom;
    let end=Math.min(H,y+cap);
    if(end<H){const c=safe.filter(v=>v>y+cap*0.45&&v<=end);if(c.length)end=Math.max.apply(null,c)}
    out.push([y,end,top]);y=end;
  }
  return out;
}
function safePoints(paper,k){
  const base=paper.getBoundingClientRect().top;
  const rs=$$('.p-brand,.p-title,.p-dates,.p-bill,.p-from,.p-ref,.p-due,.p-items thead tr,.p-items tbody tr,.p-pay,.p-note,.p-totals,.p-sign,.p-contact,.p-foot',paper)
    .filter(e=>e.getClientRects().length).map(e=>{const r=e.getBoundingClientRect();return[(r.top-base)/k,(r.bottom-base)/k]});
  /* a cut is safe when no block straddles it */
  return rs.map(r=>Math.ceil(r[1])).filter(y=>!rs.some(r=>r[0]+1<y&&y<r[1]-1));
}

/* a photographed signature: paper white becomes transparent, then crop to the ink */
function cleanSignature(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const w0=img.naturalWidth||300,h0=img.naturalHeight||100,k=Math.min(1,520/w0,200/h0);
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*k));c.height=Math.max(1,Math.round(h0*k));
      const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      try{
        const d=x.getImageData(0,0,c.width,c.height),p=d.data,hist=new Uint32Array(256);let n=0;
        for(let i=0;i<p.length;i+=4){if(p[i+3]>200){hist[Math.round(.299*p[i]+.587*p[i+1]+.114*p[i+2])]++;n++}}
        let w=255,acc=0;
        for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*.85){w=v;break}}
        if(w<150)w=255;
        const hi=w*.92,lo=w*.55;
        let x0=c.width,y0=c.height,x1=-1,y1=-1;
        for(let i=0;i<p.length;i+=4){
          const l=.299*p[i]+.587*p[i+1]+.114*p[i+2],a=l>=hi?0:l<=lo?255:Math.round((hi-l)/(hi-lo)*255);
          p[i+3]=Math.min(p[i+3],a);
          if(p[i+3]>40){const q=i/4,px=q%c.width,py=(q-px)/c.width;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
        }
        x.putImageData(d,0,0);
        if(x1>=x0&&y1>=y0){
          const m=4,cx=Math.max(0,x0-m),cy=Math.max(0,y0-m),cw=Math.min(c.width,x1+m+1)-cx,ch=Math.min(c.height,y1+m+1)-cy;
          const o=document.createElement('canvas');o.width=cw;o.height=ch;o.getContext('2d').drawImage(c,cx,cy,cw,ch,0,0,cw,ch);
          return res(o.toDataURL('image/png'));
        }
      }catch(e){}
      res(c.toDataURL('image/png'));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};
    img.src=url;
  });
}

/* edges other blocks and the page offer for snapping, in page pixels */
function snapTargets(paper,el,k){
  const pr=paper.getBoundingClientRect(),xs=[0,44,397,750,794],ys=[0,paper.offsetHeight/2];

  vals.forEach(v=>list.forEach(t=>{const d=t-v;if(Math.abs(d)<=thr&&(best===null||Math.abs(d)<Math.abs(best.d)))best={d,at:t}}));

  const key=el.dataset.b,k=(prevHostEl.clientWidth/794)||1,o=posOf(app.inv,key),T=snapTargets(paper,el,k),r=el.getBoundingClientRect();
  mv.sel=key;

  mv.drag={el,key,k,id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:o[0],oy:o[1],T,moved:false,
    l:(r.left-T.pr.left)/k,r:(r.right-T.pr.left)/k,t:(r.top-T.pr.top)/k,b:(r.bottom-T.pr.top)/k,nx:o[0],ny:o[1]};

  if(sx)dx+=sx.d;if(sy)dy+=sy.d;
  guide(paper,'gx',sx?sx.at:null);guide(paper,'gy',sy?sy.at:null);
  d.nx=Math.round(d.ox+dx);d.ny=Math.round(d.oy+dy);

const fileName=()=>((app.inv.number||'invoice').replace(/[^\w.-]+/g,'-').replace(/^-+|-+$/g,'')||'invoice')+'.pdf';
function plainText(){
  const s=app.inv,c=calc(s),M=fmt(s),L=[];
  L.push((s.title||'Invoice')+(s.number?' '+s.number:''));
  if(s.from.name)L.push('From: '+s.from.name);
  const to=[s.to.name,s.to.company].filter(Boolean).join(', ');if(to)L.push('To: '+to);
  L.push('Issued: '+fmtDate(s.issue)+'   Due: '+fmtDate(s.due),'');
  c.items.filter(i=>i.desc.trim()||i.amt).forEach(i=>L.push('- '+i.desc.replace(/\s*\n\s*/g,' ')+' ('+numStr(i.q)+' x '+M(i.rateM)+') = '+M(i.amt)));
  L.push('','Subtotal: '+M(c.subtotal));
  if(c.discount)L.push('Discount: -'+M(c.discount));
  if(c.tax)L.push((s.tax.label||'Tax')+(s.tax.inclusive?' (included)':'')+': '+M(c.tax));
  if(c.adj)L.push('Rounding: '+M(c.adj));
  L.push('Total: '+M(c.total));
  if(c.paid>0)L.push('Paid: -'+M(c.paid),'Balance due: '+M(c.due));
  if(s.payment)L.push('','Payment details:',s.payment);
  if(s.notes)L.push('','Notes:',s.notes);
  return L.join('\n');
}

const scriptP={};
function loadScript(src){
  return scriptP[src]||(scriptP[src]=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete scriptP[src];rej(new Error('Could not load '+src))};document.head.appendChild(s);
  }));
}
async function encodeImage(canvas){
  if(window.CompressionStream){
    const w=canvas.width,h=canvas.height,d=canvas.getContext('2d').getImageData(0,0,w,h).data,rgb=new Uint8Array(w*h*3);
    for(let i=0,j=0;i<d.length;i+=4,j+=3){rgb[j]=d[i];rgb[j+1]=d[i+1];rgb[j+2]=d[i+2]}
    const cs=new CompressionStream('deflate'),wr=cs.writable.getWriter();wr.write(rgb);wr.close();
    return{filter:'FlateDecode',data:new Uint8Array(await new Response(cs.readable).arrayBuffer())};
  }
  const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.95));
  return{filter:'DCTDecode',data:new Uint8Array(await blob.arrayBuffer())};
}
/* Minimal PDF writer: one full-width image per A4 page. */
async function writePdf(pages,title,bg){
  const enc=new TextEncoder(),parts=[],xref=[];let pos=0;
  const put=u=>{const b=typeof u==='string'?enc.encode(u):u;parts.push(b);pos+=b.length};
  const W=595.28,HH=841.89,n=pages.length,total=3*n+4;
  put('%PDF-1.4\n%âãÏÓ\n');
  xref[1]=pos;put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  xref[2]=pos;put('2 0 obj\n<< /Type /Pages /Kids ['+pages.map((_,i)=>(4+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>\nendobj\n');
  let hex='FEFF';for(let i=0;i<title.length;i++)hex+=title.charCodeAt(i).toString(16).padStart(4,'0');
  xref[3]=pos;put('3 0 obj\n<< /Title <'+hex+'> /Producer (Chumi invoice) >>\nendobj\n');
  for(let i=0;i<n;i++){
    const{canvas,hpx,top}=pages[i],po=4+3*i,co=po+1,io=po+2,hpt=hpx*W/794,tpt=top*W/794;
    xref[po]=pos;put(po+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+HH+'] /Resources << /XObject << /Im0 '+io+' 0 R >> >> /Contents '+co+' 0 R >>\nendobj\n');
    const rgb=hex2rgb(bg||'#ffffff').map(v=>(v/255).toFixed(3)).join(' ');
    const cs=rgb+' rg 0 0 '+W+' '+HH+' re f q '+W+' 0 0 '+hpt.toFixed(2)+' 0 '+(HH-tpt-hpt).toFixed(2)+' cm /Im0 Do Q';
    xref[co]=pos;put(co+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    const img=await encodeImage(canvas);
    xref[io]=pos;put(io+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+canvas.width+' /Height '+canvas.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /'+img.filter+' /Length '+img.data.length+' >>\nstream\n');
    put(img.data);put('\nendstream\nendobj\n');
  }
  const xpos=pos;
  put('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let k=1;k<total;k++)put(String(xref[k]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<< /Size '+total+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xpos+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
async function buildPdf(){
  if(!window.html2canvas)await loadScript(H2C);
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;pointer-events:none';
  holder.innerHTML=paperHTML(app.inv);
  const paper=holder.firstElementChild;paper.setAttribute('data-export','');
  document.body.appendChild(holder);
  try{
    let H=paper.offsetHeight,safe=safePoints(paper,1),plan=planPages(H,safe);
    if(plan.length>1){
      /* stretch the last page to a full sheet so footers and decorations sit at the bottom of it */
      const L=plan[plan.length-1],cap=PAGE.h-L[2]-PAGE.bottom,extra=cap-(L[1]-L[0]);
      if(extra>1){paper.style.minHeight=(H+extra)+'px';H=paper.offsetHeight;safe=safePoints(paper,1);plan=planPages(H,safe)}
    }
    const canvas=await window.html2canvas(paper,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,scrollX:0,scrollY:0});
    const k=canvas.height/H,pages=[];
    plan.forEach(([a,e,top])=>{
      const sub=document.createElement('canvas');sub.width=canvas.width;sub.height=Math.max(1,Math.round((e-a)*k));
      const x=sub.getContext('2d');x.fillStyle=tplOf(app.inv).pg;x.fillRect(0,0,sub.width,sub.height);
      x.drawImage(canvas,0,Math.round(a*k),canvas.width,sub.height,0,0,sub.width,sub.height);
      pages.push({canvas:sub,hpx:e-a,top});
    });
    return await writePdf(pages,((app.inv.title||'Invoice')+' '+(app.inv.number||'')).trim(),tplOf(app.inv).pg);
  }finally{holder.remove()}
}
function saveBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('#btnPdf').onclick=async()=>{
  const btn=$('#btnPdf'),lab=$('span',btn);
  btn.disabled=true;btn.classList.add('busy');lab.textContent='Making your PDF…';
  try{
    const blob=await buildPdf(),name=fileName();
    let dl=null;
    try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
    if(dl){
      try{await dl.save({filename:name,data:blob});toast('PDF saved as '+name+'.')}
      catch(err){if(!err||err.code!=='declined')toast('The PDF could not be saved here. Try again.')}
    }else{saveBlob(blob,name);toast('Downloaded '+name+'.')}
    once(btn,'pop');
  }catch(err){
    toast('The PDF tools did not load. Check your connection and try again.');
  }finally{btn.disabled=false;btn.classList.remove('busy');lab.textContent='Download PDF'}
};

/* ---------- auto invoice tool ---------- */
const catOf=id=>CATS.find(c=>c.id===id)||CATS[0];
const gstOf=x=>Math.max(0,Math.min(99,Math.round(num(x.gst))));
function autoTax(r,rate){return{label:'GST',rate:rate>0?String(rate):'',inclusive:false,fixed:rate>0?String(r.G):'',fixedFor:rate>0?r.S+'@'+rate:''}}
function autoState(r,cur,rate){
  return{currency:cur,whole:true,items:r.lines.map(l=>({id:uid(),desc:l.n,qty:String(l.q),rate:String(l.p)})),
    discount:{type:'percent',value:''},tax:autoTax(r,rate),adjustment:'',paid:''};
}
let lastX=null;
function renderTool(how){
  const el=$('#xResult');if(!el)return;
  const prev={};$$('[data-k]',el).forEach(n=>{prev[n.dataset.k]=+n.dataset.v});
  el.classList.remove('fresh');
  const x=app.xt,cat=catOf(x.cat);
  if(!cat.types.some(t=>t[0]===x.grp))x.grp='all';
  $$('#xCats [data-cat]').forEach(b=>b.setAttribute('aria-checked',b.dataset.cat===cat.id));
  const sel=$('#x-grp');
  if(sel.dataset.cat!==cat.id){sel.dataset.cat=cat.id;sel.innerHTML=cat.types.map(t=>'<option value="'+t[0]+'">'+esc(t[1])+'</option>').join('')}
  sel.value=x.grp;
  $('#x-grp-f').hidden=cat.types.length<2;
  const r=autoGenerate(x),cur=x.cur,rate=gstOf(x);
  if(r.err){lastX=null;el.innerHTML='<h3>Your invoice lines</h3><div class="status bad"><svg class="ic"><use href="#i-alert"/></svg><span>'+esc(r.err)+'</span></div>';return}
  const st=autoState(r,cur,rate),c=calc(st),M=fmt(st),exact=c.total===r.T&&c.subtotal===r.S&&c.tax===r.G;
  lastX={r,rate,cur};
  el.innerHTML='<h3>Your invoice lines</h3><ul class="xl">'
    +r.lines.map((l,i)=>'<li><span class="xl-i">'+pad(i+1)+'</span><div class="xl-n">'+esc(l.n)+'<small>'+M(l.p*100/100)+' × '+l.q+'</small></div><div class="xl-a">'+M(l.p*l.q)+'</div></li>').join('')+'</ul>'
    +'<table class="rt"><tbody>'
    +(rate>0?'<tr class="sum"><td>Subtotal</td><td data-k="sub" data-v="'+c.subtotal+'">'+M(c.subtotal)+'</td></tr><tr class="sum"><td>GST ('+rate+'%)</td><td data-k="tax" data-v="'+c.tax+'">'+M(c.tax)+'</td></tr>':'')
    +'<tr class="tot"><td>Total'+(rate>0?' incl. GST':'')+'</td><td data-k="tot" data-v="'+c.total+'">'+M(c.total)+'</td></tr></tbody></table>'
    +'<div class="status '+(exact?'ok':'bad')+'"><svg class="ic"><use href="#'+(exact?'i-check':'i-alert')+'"/></svg><span>'+(exact?(rate>0?'Subtotal '+M(c.subtotal)+' + GST '+M(c.tax)+' = exactly '+M(r.T)+'. Whole numbers only, no rounding line.':'The lines add up to exactly '+M(r.T)+'. Whole numbers only.'):'These lines come to '+M(c.total)+', not '+M(r.T)+'. Try different items.')+'</span></div>'
    +(r.note?'<p class="note">'+esc(r.note)+'</p>':'')
    +'<div class="xact"><button class="btn btn-primary btn-block" id="xUse" type="button">Use in invoice <span class="arr" aria-hidden="true">→</span></button><button class="btn btn-quiet btn-block" id="xShuffle" type="button"><svg class="ic"><use href="#i-shuffle"/></svg>Try different items</button></div>';
  if(how&&!reduced()){
    $$('.xl li',el).forEach((li,i)=>li.style.setProperty('--i',i));
    $$('.rt tr',el).forEach((tr,i)=>tr.style.setProperty('--i',r.lines.length+i));
    void el.offsetWidth;el.classList.add('fresh');
    if(how==='shuffle')$('#xShuffle').classList.add('spin');
    $$('[data-k]',el).forEach(n=>{if(n.dataset.k in prev)tween(n,prev[n.dataset.k],+n.dataset.v,M,520)});
  }
}
$('#xCats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;app.xt.cat=b.dataset.cat;app.xt.grp='all';renderTool('chip');schedule()});

});

/* ---------- router ---------- */
const ORDER={home:0,tool:1,invoice:2};
const routeOf=()=>{const h=location.hash.replace('#','');return h==='invoice'?'invoice':(h==='auto'||h==='exact-total')?'tool':'home'};
let lastRoute=null;
function route(){
  const r=routeOf(),prev=lastRoute,changed=prev!==null&&prev!==r;
  lastRoute=r;
  if(changed&&!reduced()&&document.startViewTransition){
    const root=document.documentElement,done=()=>{root.classList.remove('vt');delete root.dataset.dir};
    root.dataset.dir=ORDER[r]>=ORDER[prev]?'fwd':'back';root.classList.add('vt');
    try{document.startViewTransition(()=>applyRoute(true)).finished.then(done,done)}
    catch(e){done();applyRoute(true)}
    return;
  }
  applyRoute(changed);
}
function applyRoute(animate){
  const h=location.hash.replace('#',''),r=routeOf();
  document.body.dataset.route=r;
  $$('[data-view]').forEach(v=>{v.hidden=v.dataset.view!==r});
  $$('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===r?'page':'false'));
  if(animate)once($('[data-view]:not([hidden])'),'enter');
  if(r==='home'){
    renderHome();
    const t=h&&document.getElementById(h);
    if(t)t.scrollIntoView();else window.scrollTo(0,0);
  }else{
    window.scrollTo(0,0);
    fillForm();
    if(r==='invoice'){
      $('#sampleNote').hidden=!app.inv.sample;
      setTab(ui.tab);renderItems();renderDesign();renderPreview();renderSummary();
    }else{renderTool(animate?'enter':undefined);fillForm()}
  }
  refit();
}

function init(){
  load();
  const opts=CURRENCIES.map(([c,n])=>'<option value="'+c+'">'+c+' · '+n+'</option>').join('');
  $('#b-currency').innerHTML=opts;$('#x-cur').innerHTML=opts;
  buildDesign();
  runIntro();
  window.addEventListener('hashchange',route);
  route();
  armReveals();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{refit();moveInk();if(document.body.dataset.route==='invoice')renderPreview()});
}
init();
